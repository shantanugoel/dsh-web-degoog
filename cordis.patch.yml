# dsh-web-degoog bundle layer.
#
# Applied in dsh.profile.bundles order, after the in-box bundles and before
# the user's own ~/.dsh/<profile>/cordis.patch.yml layer.
#
# NOTE: patch fields replace wholesale (no deep merge), so override configs
# below restate every field we care about from the shipped defaults rather
# than only the ones we change.
- insert:
    - id: web-search-degoog
      name: dsh-web-degoog
      config:
        # Blank by default: the instance URL is a deployment choice. Set it
        # on the Plugins page (Installed plugins -> dsh-web-degoog -> Configure)
        # or right here. Every field below except allowPrivateAddresses is
        # volatile, so Plugins-page edits apply without a restart.
        serverUrl: ''
        apiKeyEnv: DEGOOG_API_KEY
        searchType: web
        lang: ''
        # Fetch-side SSRF escape hatch: dial private/loopback addresses (LAN
        # self-hosted targets). Keep false unless this machine must scrape
        # LAN hosts.
        allowPrivateAddresses: false

# Installing this bundle means using degoog. Official search returns when
# the bundle is removed, or if a later user patch sets another id.
# dsh-web has no settings namespace of its own, so this is the no-file-edit
# selection path; the Plugins page only edits this plugin's own fields.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: degoog
    fetchProvider: degoog
